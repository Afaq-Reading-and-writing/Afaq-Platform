<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - آفاق للقراءة والكتابة</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon-180.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <div class="login-shell">
    <div class="login-card">
      <div class="brand">آفاق للقراءة والكتابة</div>
      <div class="tagline">سجّل الدخول لمتابعة دروسك وواجباتك</div>

      <div id="loginMsg"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">تسجيل الدخول</button>
        <div style="text-align:left; margin-top: 10px;">
          <a href="#" id="forgotPasswordLink" style="font-size: 13px; color: var(--color-primary-dark);">نسيت كلمة المرور؟</a>
        </div>
      </form>

      <div id="forgotPasswordPanel" style="display:none;">
        <p style="font-size: 13px; color: var(--ink-soft); margin-bottom: 16px;">
          أدخل بريدك الإلكتروني وسنرسل لك رابطاً لتعيين كلمة مرور جديدة.
        </p>
        <div class="field">
          <label for="forgotEmail">البريد الإلكتروني</label>
          <input type="email" id="forgotEmail" required>
        </div>
        <div id="forgotMsg"></div>
        <button type="button" class="btn-primary btn--block" id="sendResetBtn">إرسال رابط الاستعادة</button>
        <div style="text-align:center; margin-top: 14px;">
          <a href="#" id="backToLoginLink" style="font-size: 13px; color: var(--ink-soft);">→ رجوع لتسجيل الدخول</a>
        </div>
      </div>

      <div style="text-align:center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line);">
        <p style="font-size: 13px; color: var(--ink-soft); margin-bottom: 10px;">ليس لديك حساب بعد؟</p>
        <a href="https://wa.me/249904307111?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%D8%8C%20%D8%A3%D8%B1%D8%BA%D8%A8%20%D8%A8%D8%A7%D9%84%D8%AA%D8%B3%D8%AC%D9%8A%D9%84%20%D9%81%D9%8A%20%D9%85%D9%86%D8%B5%D8%A9%20%D8%A2%D9%81%D8%A7%D9%82%20%D9%84%D9%84%D9%82%D8%B1%D8%A7%D8%A1%D8%A9%20%D9%88%D8%A7%D9%84%D9%83%D8%AA%D8%A7%D8%A8%D8%A9"
           target="_blank"
           class="btn-ghost btn--block"
           style="text-decoration:none; display:flex; align-items:center; justify-content:center; gap:8px;">
          📱 تواصل للتسجيل عبر واتساب
        </a>
      </div>

      <div style="text-align:center; margin-top: 18px; font-size: 12px; color: var(--ink-soft);">
        <a href="about.html" style="color: var(--ink-soft);">من نحن</a>
        ·
        <a href="privacy.html" style="color: var(--ink-soft);">الخصوصية</a>
        ·
        <a href="terms.html" style="color: var(--ink-soft);">الشروط</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabaseClient.js"></script>
  <script src="assets/auth.js"></script>

    🛠️ تطوير:
    <a href="mailto:amjad8835m@gmail.com" style="color:var(--color-primary-dark); font-weight:700;">أمجد</a>
    ·
    <a href="https://wa.me/2490112159495?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D9%8B%20%D8%A3%D8%B9%D8%AC%D8%A8%D9%86%D9%8A%20%D9%86%D8%B8%D8%A7%D9%85%20%D8%A2%D9%81%D8%A7%D9%82%20%D9%88%D8%A3%D8%B1%D8%BA%D8%A8%20%D8%A8%D9%86%D8%B8%D8%A7%D9%85%20%D9%85%D8%B4%D8%A7%D8%A8%D9%87" style="color:var(--color-primary-dark); font-weight:700;" target="_blank">تواصل معي لتطوير مشروع مشابه 💬</a>
  </footer>

</html>
