<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعيين كلمة المرور - آفاق للقراءة والكتابة</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon-180.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <div class="login-shell">
    <div class="login-card">
      <div class="brand">📖 آفاق للقراءة والكتابة</div>
      <div class="tagline">أدخل كلمة المرور الجديدة لحسابك</div>

      <div id="msg"></div>

      <form id="reset-password-form">
        <div class="field">
          <label for="password">كلمة المرور الجديدة</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirm-password">تأكيد كلمة المرور</label>
          <input type="password" id="confirm-password" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">تحديث كلمة المرور</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabaseClient.js"></script>
  <script>
    const form = document.getElementById('reset-password-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit-btn');

    function showMsg(text, type) {
      msg.innerHTML = `<div class="msg msg-${type}">${text}</div>`;
    }

    // فحص أساسي: هل يوجد رمز دعوة/استرجاع صالح في هذا الرابط أصلاً؟
    // بدون هذا الفحص، من يفتح الصفحة مباشرة بدون رابط بريد صحيح يرى نموذجاً لا يعمل بلا تفسير
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        showMsg('هذا الرابط غير صالح أو منتهي الصلاحية. اطلب رابطاً جديداً من الإدارة أو من "نسيت كلمة المرور".', 'error');
        form.style.display = 'none';
      }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        showMsg('كلمتا المرور غير متطابقتين', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'جارٍ التحديث...';

      const { error } = await supabaseClient.auth.updateUser({ password });

      if (error) {
        console.error('تفاصيل الخطأ:', error);
        showMsg('حدث خطأ: ' + error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'تحديث كلمة المرور';
        return;
      }

      showMsg('تم تغيير كلمة المرور بنجاح! يتم توجيهك الآن...', 'success');

      // توجيه ذكي بحسب دور المستخدم، مع معالجة حالة الحساب غير المفعّل بعد
      const { data: { user } } = await supabaseClient.auth.getUser();
      const { data: profile } = await supabaseClient
        .from('users')
        .select('role, is_active')
        .eq('id', user.id)
        .single();

      setTimeout(() => {
        if (!profile || !profile.is_active) {
          showMsg('تم تعيين كلمة مرورك بنجاح. حسابك بانتظار تفعيل الإدارة، تواصل معنا عبر واتساب لإتمام التفعيل.', 'success');
          supabaseClient.auth.signOut();
          return;
        }
        if (profile.role === 'admin') window.location.href = 'admin.html';
        else if (profile.role === 'teacher') window.location.href = 'teacher.html';
        else window.location.href = 'student.html';
      }, 1500);
    });
  </script>
</body>
</html>
