<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعيين كلمة المرور الجديدة - منصة آفاق</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            border-color: #3498db;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219150;
        }
        .message {
            margin-top: 15px;
            font-size: 14px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>إعادة تعيين كلمة المرور</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">أدخل كلمة المرور الجديدة للحساب</p>
        
        <form id="reset-password-form">
            <div class="form-group">
                <label for="password">كلمة المرور الجديدة</label>
                <input type="password" id="password" required placeholder="******" minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm-password">تأكيد كلمة المرور</label>
                <input type="password" id="confirm-password" required placeholder="******">
            </div>
            <button type="submit" id="submit-btn">تحديث كلمة المرور</button>
        </form>

        <div id="msg" class="message"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://xewxzqclrtachuqvioct.supabase.co"; 
const SUPABASE_ANON_KEY = "sb_publishable_tF-4kr96F4cT5fJs14j11w_5Zoo1VqD";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('reset-password-form');
        const msg = document.getElementById('msg');
        const btn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                showMsg('كلمتا المرور غير متطابقتين', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'جارٍ التحديث...';

            // تحديث كلمة المرور باستخدام الجلسة الحالية المعطاة عبر الـ Token في الرابط
            const { data, error } = await supabaseClient.auth.updateUser({ password: password });

            if (error) {
                showMsg('حدث خطأ: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerText = 'تحديث كلمة المرور';
            } else {
                showMsg('تم تغيير كلمة المرور بنجاح! يتم توجيهك الآن لصفحة الدخول...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html'; // أو صفحة تسجيل الدخول الخاصة بك
                }, 2500);
            }
        });

        function showMsg(text, type) {
            msg.innerText = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
        }
    </script>
</body>
</html>
